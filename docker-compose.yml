# docker-compose.yml — banco e aplicacao (feature 008).
#
# Dois servicos e DOIS regimes de persistencia, e a diferenca e deliberada (D-08):
#
#   - os UPLOADS vao em bind mount, para o operador enxergar o arquivo que ele mesmo enviou,
#     e porque a pasta ja esta coberta pelo `.gitignore` (`uploads/`, em qualquer
#     profundidade) — nada novo a ignorar;
#   - os DADOS DO BANCO vao em volume NOMEADO, porque diretorio de dados do PostgreSQL sobre
#     bind mount no Windows/Docker Desktop e fonte conhecida de erro de permissao, e o
#     operador nao ganha nada vendo os arquivos internos do SGBD.
#
# NENHUMA CREDENCIAL TEM VALOR PADRAO AQUI (RF-11). As quatro variaveis usam `${VAR:?}`, que
# faz o `docker compose` PARAR com mensagem explicita quando a variavel nao existe. Um valor
# padrao dentro de arquivo versionado e credencial versionada, ainda que disfarcada. Os
# valores vivem no `.env`, que o `.gitignore` ja exclui (linha 6).

name: genealogia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env — ver onboarding.md secao 2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env — ver onboarding.md secao 2}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env — ver onboarding.md secao 2}
    volumes:
      # Estado persistente do SGBD. Sobrevive a `down` e a `up`; so `down -v` o remove.
      - dados_do_banco:/var/lib/postgresql/data
      # O esquema. O entrypoint do PostgreSQL executa o que estiver aqui apenas quando o
      # diretorio de dados esta VAZIO; a reexecucao manual e protegida pela idempotencia do
      # proprio arquivo (RF-12). Somente-leitura porque nao ha por que escrever nele.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Publicado SO no loopback do host (RF-01). Serve a duas coisas: o operador consultar o
      # historico por `psql`, e os testes de banco que rodam no `.venv` do host apontarem
      # `DATABASE_URL` para `localhost:5432` em vez de `db:5432`.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Existe para o operador e para o `docker compose ps`. NINGUEM o consome como portao de
      # subida: ver o `depends_on` do servico `app`.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # O commit entra como rotulo da imagem quando voce o informa, com
        # `$env:REVISAO = git rev-parse --short HEAD` antes do `up -d --build`. Sem ele o
        # rotulo diz `desconhecida` — e `/app/CONSTRUIDO_EM` continua dizendo QUANDO esta
        # imagem foi construida, que e a marca que responde "o container esta defasado?".
        REVISAO: ${REVISAO:-desconhecida}
    environment:
      # `0.0.0.0` DENTRO do container. A publicacao de porta do Docker chega pelo IP do
      # container, e `127.0.0.1` aqui tornaria a aplicacao inalcancavel (D-10). O ato
      # explicito de expor a rede continua sendo a linha `ports:` abaixo.
      ANALISADOR_HOST: "0.0.0.0"
      ANALISADOR_PORT: "5000"
      # Sem valor padrao, pelo mesmo motivo de RF-11. Dentro da rede do compose o host do
      # banco e `db`, o nome do servico.
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env — ver onboarding.md secao 2}
      # Entrada pelo provedor de identidade (feature 051). As cinco sao OBRIGATORIAS:
      # sem qualquer uma delas o servidor recusa a subida, de proposito. Credencial
      # ausente nao pode degradar para acesso aberto.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no .env — ver onboarding.md secao 3}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET no .env — ver onboarding.md secao 3}
      ANALISADOR_SECRET_KEY: ${ANALISADOR_SECRET_KEY:?defina ANALISADOR_SECRET_KEY no .env — ver onboarding.md secao 3}
      ANALISADOR_URL_PUBLICA: ${ANALISADOR_URL_PUBLICA:?defina ANALISADOR_URL_PUBLICA no .env — ver onboarding.md secao 3}
      ANALISADOR_DONO_INICIAL: ${ANALISADOR_DONO_INICIAL:?defina ANALISADOR_DONO_INICIAL no .env — ver onboarding.md secao 3}
      # O modo de identidade e DECLARADO (auditoria de 2026-10-30), e a recusa mora em
      # `create_app`: sem esta variavel o servidor NAO sobe. O padrao `google` esta
      # escrito aqui porque este arquivo e o contrato desta instancia — as cinco
      # variaveis acima sao obrigatorias — e porque uma atualizacao do codigo nao pode
      # transformar uma subida que funcionava em recusa silenciosa.
      ANALISADOR_MODO: ${ANALISADOR_MODO:-google}
      # Envio de e-mail da identidade local (feature 053). Sao OPCIONAIS: sem HOST e
      # REMETENTE o transporte vira nulo, a aplicacao sobe, o cadastro nao conclui e a
      # recuperacao avisa. Diferente das cinco variaveis do Google, a ausencia destas
      # nao recusa a subida — o e-mail e canal de confirmacao/recuperacao, nao de entrada.
      # Para o Docker, preencha estas linhas no `.env` (o compose le `.env`, nao `.env.local`).
      ANALISADOR_SMTP_HOST: ${ANALISADOR_SMTP_HOST:-}
      ANALISADOR_SMTP_PORT: ${ANALISADOR_SMTP_PORT:-587}
      ANALISADOR_SMTP_USUARIO: ${ANALISADOR_SMTP_USUARIO:-}
      ANALISADOR_SMTP_SENHA: ${ANALISADOR_SMTP_SENHA:-}
      ANALISADOR_SMTP_REMETENTE: ${ANALISADOR_SMTP_REMETENTE:-}
      ANALISADOR_SMTP_SEGURANCA: ${ANALISADOR_SMTP_SEGURANCA:-starttls}
      # Cache da arvore entre requisicoes (feature 047), LIGADO por padrao no codigo: a segunda
      # acao sobre a mesma arvore nao paga o parse de ~50 s. O teto e o numero de arvores
      # mantidas; 1 cobre o caso de uso e leva o processo a ~412 MB (~337 MB da arvore e
      # ~31 MB de indices). Para desligar em host pequeno, troque o valor por "0".
      ANALISADOR_CACHE_DE_ARVORE: "1"
      ANALISADOR_CACHE_DE_ARVORE_CAPACIDADE: "1"
    volumes:
      # Estado persistente dos uploads, no MESMO caminho que `src/app.py` deriva de
      # `__file__` (`/app/src/uploads`). Sem `ANALISADOR_UPLOAD_FOLDER`: escrita e leitura
      # usam o caminho que o codigo ja resolve.
      - ./src/uploads:/app/src/uploads
      # A trilha de auditoria (feature 049). E prova, nao diagnostico: precisa sobreviver ao
      # container. O caminho e o mesmo que `utils/logs.py` resolve — a raiz da aplicacao,
      # que dentro da imagem e `/app`. Sem este volume a auditoria cai para o fluxo padrao e
      # a aplicacao avisa uma vez, sem derrubar requisicao.
      - ./logs:/app/logs
      # O arquivo de contas locais (feature 053). Fica em `src/dados/`, FORA de
      # `src/uploads/`, porque a tela de entrada varre aquela pasta e a conta apareceria na
      # lista. Sem este volume, recriar o container apaga as contas — e o operador perde a
      # entrada por senha, nao o historico, que vive no banco.
      - ./src/dados:/app/src/dados
    ports:
      - "127.0.0.1:5080:5000"
    # Rotacao do log do PROPRIO container (feature 049): o stdout nao pode crescer sem teto.
    # Os 5 x 5 MB sao os mesmos numeros do arquivo geral de `utils/logs.py`, e por um motivo
    # pratico: o operador nao precisa lembrar de dois conjuntos de numeros.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    depends_on:
      # Forma CURTA: ordena a subida e NAO espera o banco ficar saudavel. E a consequencia
      # direta do Q-03/RN-13 — se a aplicacao so subisse depois do banco saudavel, com o
      # banco fora do ar o operador NAO TERIA NEM A ANALISE, que e exatamente o desfecho que
      # a RN-13 existe para impedir. NAO troque por `condition: service_healthy`.
      - db
    restart: unless-stopped

volumes:
  dados_do_banco:
    # Sem `external`: o Compose cria e gerencia. O nome real ganha o prefixo do projeto
    # (`genealogia_dados_do_banco`), e ele vive fora do repositorio.
