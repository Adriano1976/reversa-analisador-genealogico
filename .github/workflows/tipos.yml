# Portão de tipos de todo o código de produto.
#
# A régua é o pyrefly.toml: preset default no repositório, com `[[sub-config]]`
# estrito em `src/ports/**`. Este workflow não redefine régua.
#
# `pyrefly check src` cobre todo o `src/` e está em 0 erros. As supressões
# existentes (`# pyrefly: ignore`/`# type: ignore`) seguem invisíveis ao portão —
# ele mede erro, não supressão. A de `gedcom_parser.py` é a única declarada como
# erro do stub do ged4py; as demais (hoje 19 no total) são dívida a auditar.
#
# `tests/` fica fora do portão de propósito: hoje são 247 diagnósticos de
# fixture, não de produto.
#
# O script da skill fica fora do `pyrefly check` (o `.github/` é excluído pelos
# padrões default), por isso ele é passado como alvo explícito.
name: tipos

on:
  push:
  pull_request:

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyrefly==1.4.0"

      - name: Código de produto — régua do projeto
        run: pyrefly check src

      - name: Script da skill
        run: pyrefly check .github/skills/pyrefly-checker/checker.py
