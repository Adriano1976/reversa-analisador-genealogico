<main>
  <div class="crumb"><a href="index.html">Início</a> / Glossário</div>
  <h1>Glossário de conceitos</h1>
  <p class="summary">Termos e entidades centrais que estruturam o domínio do analisador-genealogico, destilados em um mapa mental do sistema.</p>
  <input id="search" type="search" placeholder="Buscar termo ou definição... (ex.: GEDCOM, cM, MRCA)">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Nenhum conceito encontrado para a busca.</div>
</main>
<script>
(function(){
  "use strict";
  var g = (window.RV_DATA && window.RV_DATA.glossary) || {};
  var concepts = g.concepts || [];
  var grid = document.getElementById("grid");
  function slug(t){ return (t||"").toLowerCase().replace(/\W+/g,"-").replace(/^-|-$/g,"") || "conceito"; }
  concepts.forEach(function(c){
    var card = document.createElement("article");
    card.className = "card";
    var id = slug(c.term);
    card.id = "concept-" + id;
    var h = document.createElement("h2");
    h.textContent = c.term;
    card.appendChild(h);
    var p = document.createElement("p");
    p.textContent = c.definition;
    card.appendChild(p);
    grid.appendChild(card);
  });
  var cards = Array.prototype.slice.call(grid.children);
  var empty = document.getElementById("empty");
  var search = document.getElementById("search");
  function apply(){
    var q = search.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function(card){
      var hit = !q || card.textContent.toLowerCase().indexOf(q) !== -1;
      card.style.display = hit ? "" : "none";
      if(hit) shown++;
    });
    empty.style.display = shown ? "none" : "block";
  }
  search.addEventListener("input", apply);
})();
</script>
