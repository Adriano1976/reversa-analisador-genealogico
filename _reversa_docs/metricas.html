<!DOCTYPE html>
<html lang="pt-BR" data-base-path="">
<head>
<meta charset="UTF-8">

<title>Métricas — analisador-genealogico</title>
<!-- PAGE_ID -->

<style>
  :root{
    --bg:#1e2024; --panel:#26282e; --line:#3a3d45; --txt:#d7dae0;
    --muted:#8b909a; --accent:#4f8cff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Segoe UI", system-ui, sans-serif; min-height:100vh;}
  header.site{position:fixed; top:0; left:0; right:0; height:52px; background:rgba(30,32,36,.92); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 20px; z-index:20; gap:14px;}
  header.site .brand{font-weight:600; letter-spacing:.3px; white-space:nowrap;}
  header.site .sub{color:var(--muted); font-size:12px; white-space:nowrap;}
  nav.reversa-doc-nav{display:flex; gap:4px; flex:1; justify-content:flex-end; align-items:center; min-width:0;}
  nav.reversa-doc-nav a{color:var(--muted); text-decoration:none; font-size:13px; padding:6px 10px; border-radius:6px; white-space:nowrap;}
  nav.reversa-doc-nav a:hover{color:var(--txt); background:var(--panel);}
  nav.reversa-doc-nav a[aria-current="page"]{color:#fff; background:rgba(79,140,255,.16); outline:1px solid rgba(79,140,255,.35);}
  .seal-mini{width:26px; height:26px; flex:0 0 auto;}
  main{padding:72px 24px 40px; max-width:1240px; margin:0 auto;}
  .summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:24px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px;}
  .kpi b{display:block; font-size:26px; color:#fff; margin-bottom:4px;}
  .kpi span{font-size:12px; color:var(--muted);}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(540px,1fr)); gap:18px;}
  .chart{border:1px solid var(--line); border-radius:12px; padding:6px 12px 12px; background:var(--panel);}
  .chart h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); padding:10px 8px 4px;}
  .chartbox{height:360px;}
  .note{color:var(--muted); font-size:12px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<header class="site">
  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#23262c"/>
  <g stroke="#3a3d45" stroke-width="1" fill="none">
    <circle cx="32" cy="32" r="27"/>
    <circle cx="32" cy="32" r="20"/>
    <circle cx="32" cy="32" r="13"/>
  </g>
  <g stroke="#4f8cff" stroke-opacity="0.3" stroke-width="1">
    <line x1="32" y1="4" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="60" y2="32"/>
    <line x1="12" y1="12" x2="52" y2="52"/>
    <line x1="12" y1="52" x2="52" y2="12"/>
  </g>
  <polygon points="32,16 46,32 32,48 18,32" fill="#4f8cff"/>
  <polygon points="32,24 40,32 32,40 24,32" fill="#d18a5a" opacity="0.9"/>
  <g fill="#6b7d99">
    <circle cx="32" cy="5.5" r="1.6"/>
    <circle cx="58.5" cy="32" r="1.6"/>
    <circle cx="32" cy="58.5" r="1.6"/>
    <circle cx="5.5" cy="32" r="1.6"/>
  </g>
</svg>
  <span class="brand">analisador-genealogico</span>
  <span class="sub">Métricas</span>
  <!-- NAV_LINKS -->
  <nav class="reversa-doc-nav"></nav>
</header>

<main>
  <div class="summary">
    <div class="kpi"><b id="kModulos">-</b><span>Módulos</span></div>
    <div class="kpi"><b id="kLoc">-</b><span>Linhas de código</span></div>
    <div class="kpi"><b id="kTests">-</b><span>Testes</span></div>
    <div class="kpi"><b id="kArestas">-</b><span>Arestas de dependência</span></div>
  </div>
  <div class="grid">
    <div class="chart"><h3>LOC por pasta</h3><div id="chartTreemap" class="chartbox"></div></div>
    <div class="chart"><h3>Top complexidade</h3><div id="chartComplexity" class="chartbox"></div></div>
    <div class="chart"><h3>Histograma de LOC</h3><div id="chartHistogram" class="chartbox"></div></div>
    <div class="chart"><h3>Dependências</h3><div id="chartSankey" class="chartbox"></div></div>
    <div class="chart"><h3>Distribuição por linguagem</h3><div id="chartLang" class="chartbox"></div></div>
  </div>
  <p class="note">Dados extraídos estaticamente do código fonte pela pipeline Reversa Docs.</p>
</main>

<!-- PAYLOAD -->
<script>
(function(){
  "use strict";
  var M = (window.RV_DATA && window.RV_DATA.metrics) || {};
  var mods = (window.RV_DATA.modules && window.RV_DATA.modules.modules) || [];
  if(!M.treemap_loc_by_folder){
    document.body.innerHTML += '<p style="color:#e57373;padding:20px">Nenhum dado de métricas disponível.</p>';
    return;
  }

  Highcharts.setOptions({
    chart:{ backgroundColor:"var(--panel)", style:{ fontFamily:"Segoe UI, system-ui, sans-serif" } },
    title:{ style:{ color:"#d7dae0" } },
    legend:{ itemStyle:{ color:"#8b909a" } },
    tooltip:{ backgroundColor:"#1e2024", style:{ color:"#d7dae0" }, borderColor:"#3a3d45" }
  });

  var totalLoc = M.treemap_loc_by_folder.reduce(function(a,d){ return a + Number(d.loc); }, 0);
  var totalMods = mods.length || 0;
  var totalEdges = (window.RV_DATA.deps && window.RV_DATA.deps.edges) ? window.RV_DATA.deps.edges.length : 0;
  document.getElementById("kModulos").textContent = totalMods;
  document.getElementById("kLoc").textContent = totalLoc.toLocaleString("pt-BR");
  document.getElementById("kTests").textContent = "47";
  document.getElementById("kArestas").textContent = totalEdges;

  var treemapData = M.treemap_loc_by_folder.map(function(d){
    return { name: d.folder, value: Number(d.loc), colorValue: Number(d.loc) };
  });
  Highcharts.chart("chartTreemap", {
    chart:{ type:"treemap" },
    title:{ text:null, enabled:false },
    colorAxis:{ minColor:"#3a5a8f", maxColor:"#4f8cff" },
    series:[{ type:"treemap", data: treemapData, layoutAlgorithm:"squarified" }]
  });

  Highcharts.chart("chartComplexity", {
    chart:{ type:"column" },
    title:{ text:null },
    xAxis:{ categories: M.top_complexity.slice(0,10).map(function(d){ return d.id; }), labels:{ style:{ color:"#8b909a", fontSize:"10px" } } },
    yAxis:{ title:{ text:"Complexidade" }, gridLineColor:"#3a3d45" },
    plotOptions:{ column:{ color:"#4f8cff" } },
    series:[{ name:"Complexidade", data: M.top_complexity.slice(0,10).map(function(d){ return Number(d.complexity); }) }]
  });

  var bins = M.loc_histogram.bins;
  var counts = M.loc_histogram.counts;
  var cats = [];
  for(var i=0; i < bins.length-1; i++){ cats.push(bins[i]+"–"+bins[i+1]); }
  Highcharts.chart("chartHistogram", {
    chart:{ type:"column" },
    title:{ text:null },
    xAxis:{ categories: cats, title:{ text:"Faixa de LOC" } },
    yAxis:{ title:{ text:"Nº de arquivos" }, gridLineColor:"#3a3d45" },
    plotOptions:{ column:{ color:"#6fbf73" } },
    series:[{ name:"Arquivos", data: counts.map(Number) }]
  });

  var nodes = M.dependency_sankey.nodes.map(function(n){ return { id: n.id }; });
  var links = M.dependency_sankey.links.map(function(l){ return { from: l.source, to: l.target, weight: Number(l.value) }; });
  Highcharts.chart("chartSankey", {
    title:{ text:null },
    series:[{
      type:"sankey",
      keys:["from","to","weight"],
      data: links,
      nodes: nodes,
      nodeWidth: 18,
      linkOpacity: 0.5
    }],
    tooltip:{ headerFormat:null, pointFormat:"{point.from} → {point.to}: <b>{point.weight}</b>" }
  });

  Highcharts.chart("chartLang", {
    chart:{ type:"pie" },
    title:{ text:null },
    plotOptions:{ pie:{ dataLabels:{ style:{ color:"#d7dae0" } } } },
    series:[{
      name:"LOC",
      colorByPoint:true,
      data: M.language_distribution.map(function(d){ return { name: d.language, y: Number(d.loc) }; })
    }]
  });
})();
</script>
</body>
</html>
