<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Conexões Genealógicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-top: 1.5rem; }
        .nav-tabs { margin-bottom: 1.5rem; }
        .spinner-border { width: 3rem; height: 3rem; }
        .graph-container {
            border: 1px solid #dee2e6;
            border-radius: .375rem;
            padding: 1rem;
            background-color: #fafafa;
            overflow-x: auto;
        }
        .mermaid { text-align: center; }
        .secao { margin-top: 1.75rem; border-top: 1px solid #dee2e6; padding-top: 1rem; }
        .secao h5 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; }
        .secao h5 .numero { color: #6c757d; }
        .rotulo-fonte { font-size: .8rem; color: #6c757d; text-transform: uppercase; letter-spacing: .04em; }
        .tabela-evidencia { font-size: .85rem; }
        .alerta-aviso { border-left: 4px solid #ffc107; background: #fffdf5; padding: .6rem .8rem; margin-bottom: .5rem; border-radius: .25rem; font-size: .9rem; }
        .estado-COMPATIVEL { background-color: #198754; }
        .estado-POSSIVEL { background-color: #fd7e14; }
        .estado-CONFLITANTE { background-color: #dc3545; }
        .estado-INCONCLUSIVO { background-color: #6c757d; }
        .documental-ambiguo { color: #b02a37; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm main-card">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Analisador Genealógico e de DNA</h1>

                        

                        
                            <p class="text-center text-muted">Para começar, carregue a sua árvore genealógica em formato GEDCOM.</p>
                            <form method="POST" enctype="multipart/form-data" id="gedcom-upload-form">
                                <input type="hidden" name="action" value="upload_gedcom">
                                <div class="mb-3">
                                    <label for="gedcom" class="form-label"><b>Arquivo GEDCOM</b></label>
                                    <input class="form-control" type="file" id="gedcom" name="gedcom" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">Carregar e Analisar</button>
                                </div>
                            </form>
                        

                        <div id="loading" class="text-center mt-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Analisando...</span></div>
                            <p class="mt-2">Analisando... Isso pode levar alguns segundos.</p>
                        </div>
                    </div>
                </div>

                <div id="results-area">
                    

                    


                    
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
            setTimeout(() => {
                const mermaidElements = document.querySelectorAll(".mermaid");
                if (mermaidElements.length) {
                    mermaid.run({ nodes: mermaidElements });
                }
            }, 100);
        });

        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('results-area').style.display = 'none';
            });
        });
    </script>

</body>
</html>
