# Contrato HTTP do analisador-genealogico
#
# AVISO DE NATUREZA — leia antes de usar.
#
# Esta aplicacao NAO e uma API JSON. Ela tem QUATRO rotas: uma rota unica (`/`,
# GET+POST) que recebe formularios e devolve HTML renderizado no servidor
# (Jinja2), e DUAS rotas de arte (`/apple-touch-icon.png` e `/banner.png`).
# Este documento descreve esse contrato em OpenAPI 3.0 porque a granularidade
# das specs escolhida para o projeto e `endpoint` — o contrato HTTP E a unidade.
#
# Consequencias praticas de ser um contrato de formulario e nao uma API:
#   1. Nao ha corpo JSON em nenhuma requisicao ou resposta.
#   2. Erro de negocio NAO vira status 4xx: vira HTML com `success=false` e status 200.
#      As UNICAS excecoes sao o teto de corpo (16 MB), que responde 413 antes da rota
#      executar, e o 405 das rotas de arte, que sai do ROTEADOR.
#   3. Nao ha autenticacao, sessao, cookie ou cabecalho de autorizacao.
#   4. Os `action` pos-upload exigem `gedcom_filename`: e a REFERENCIA do arquivo que
#      substitui a sessao. A arvore e PARSEADA a cada requisicao e entra por parametro
#      em todo o nucleo (ADR-24) — nao ha estado de arvore sobrevivendo entre requisicoes.
#   5. O status HTTP que a tabela de traducao calcula (404/422) NAO tem consumidor nesta
#      onda: nenhuma tela o le (BR-D-95).
#
# Gerado pelo Reversa-Writer em 2026-10-10 (re-extracao, nivel completo).
#   Substitui a versao de 2026-10-05, que descrevia UMA acao pos-upload, o pattern
#   de ALFABETO FECHADO na chave (removido em 2026-10-10, RN-20/ADR-32) e a ausencia
#   de banco de dados (a persistencia Postgres entrou na feature 008, ADR-27).
# Fontes: src/app.py, src/utils/validate.py, src/ports/, src/application/*,
#         src/core/*, tests/test_upload_seguranca.py, tests/test_porta_de_armazenamento.py
# Escala de confianca: CONFIRMADO no codigo.

openapi: 3.0.3

info:
  title: analisador-genealogico — contrato HTTP
  version: 2.0.0
  description: |
    Aplicacao web Flask de rota unica para analise de genealogia genetica.

    Cruza uma arvore GEDCOM com uma lista de matches de DNA e responde tres
    perguntas separadas: o que o GEDCOM afirma (parentesco documental), o que o
    arquivo de DNA informa (evidencia genetica) e se as duas coisas sao
    compativeis entre si (confronto, em quatro estados).

    **A persistencia e OPCIONAL e nunca bloqueia o resultado.** Com
    `DATABASE_URL` definida e o banco respondendo, cada analise de DNA e gravada
    num historico de 6 tabelas; sem a variavel, o registrador e nulo e a tela nao
    muda um byte. Falha de driver, de conexao ou de SQL vira **aviso na tela**,
    nunca interrupcao.

    **Nao ha autenticacao.** Nao ha usuario, sessao, papel ou permissao. O campo
    `owner_id` existe nas tabelas e **nenhuma** consulta filtra por ele.

    **A arte servida nao e a arte canonica.** As duas rotas de arte respondem
    renderizacoes DERIVADAS, commitadas em `src/assets/`.
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:5000
    description: |
      Padrao de escuta local. Alteravel por ANALISADOR_HOST e ANALISADOR_PORT.
      Abrir para a rede e ato explicito do operador; uma segunda instancia na
      mesma porta e recusada.

tags:
  - name: rota
    description: A rota unica da aplicacao, com despacho pelo campo `action`.
  - name: upload-gedcom
    description: Unit `upload-gedcom` — acao `upload_gedcom`.
  - name: tela-de-entrada
    description: Unit `tela-de-entrada` — `GET /` e as acoes `aposentar_arquivo` e `selecionar_arvore`.
  - name: analise-dna
    description: Unit `analise-dna` — acao `dna_analysis`.
  - name: busca-caminho
    description: Unit `busca-caminho` — acao `path_search`.
  - name: recursos-da-tela
    description: Unit `recursos-da-tela` — as duas rotas de arte.

paths:
  /:
    get:
      tags: [rota, tela-de-entrada]
      summary: Tela de entrada, com as duas abas ja preenchidas
      description: |
        Renderiza a unica tela da aplicacao, no estado inicial: sem arvore
        carregada e sem mensagem, **mas com as duas listas de arquivos
        armazenados**. As listas entram por **processador de contexto**, e nao
        por parametro: toda renderizacao de `index.html` as recebe.
      operationId: formularioInicial
      responses:
        '200':
          description: HTML da tela inicial.
          content:
            text/html:
              schema:
                type: string
                description: Documento HTML renderizado por Jinja2.

    post:
      tags: [rota]
      summary: Despacho por `action` — cinco acoes
      description: |
        Toda a interacao passa por aqui. O campo `action` decide o ramo:

        - `upload_gedcom`       — valida, grava e devolve a arvore parseada (nao exige `gedcom_filename`).
        - `aposentar_arquivo`   — move um arquivo da lista para `_aposentados/` (nao exige `gedcom_filename`).
        - `selecionar_arvore`   — resolve a arvore clicada na lista e renderiza o estado "arvore aberta".
        - `dna_analysis`        — cruza a arvore com um CSV de matches (exige `gedcom_filename`).
        - `path_search`         — busca a conexao entre duas pessoas (exige `gedcom_filename`).

        **A ordem dos ramos e contrato:** `aposentar_arquivo` e tratado **antes**
        da resolucao da arvore do formulario, porque a arvore escolhida pode ser
        exatamente a que se esta aposentando — depois do move, o parse falharia e
        o operador veria "arquivo nao existe mais" no lugar da confirmacao.

        Em todos os ramos pos-upload o servidor **resolve e parseia** a arvore a
        partir da referencia recebida. A arvore e um **valor de retorno** que
        atravessa a fronteira por parametro; nao ha estado global de arvore.
      operationId: despachar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RequisicaoUploadGedcom'
                - $ref: '#/components/schemas/RequisicaoAposentarArquivo'
                - $ref: '#/components/schemas/RequisicaoSelecionarArvore'
                - $ref: '#/components/schemas/RequisicaoAnaliseDna'
                - $ref: '#/components/schemas/RequisicaoBuscaCaminho'
      responses:
        '200':
          description: |
            HTML da tela com `message`, `success` e, conforme o caso,
            `gedcom_filename`, `all_names`, `arvores_da_lista`,
            `relatorios_da_lista`, `path_result`, `dna_results`,
            `skipped_matches` e `aviso_de_persistencia`.

            **Erro de negocio nao altera o status**: a resposta e 200 com
            `success=false` e a mensagem dentro do HTML.
          content:
            text/html:
              schema:
                type: string
        '413':
          description: |
            Corpo da requisicao acima de 16 MB (MAX_CONTENT_LENGTH). Recusado
            pelo Flask **antes** de a rota executar; nenhum byte e lido nem
            gravado.
          content:
            text/html:
              schema:
                type: string
                example: '<div class="alert alert-danger">Arquivo maior que o limite de 16 MB.</div>'

  /apple-touch-icon.png:
    get:
      tags: [recursos-da-tela]
      summary: Icone de atalho do sistema movel
      description: |
        Servido por **caminho convencional**: o sistema procura este caminho na
        raiz, e nao ha como declara-lo no documento. O template NAO o menciona, e
        `GET /` continua byte a byte o mesmo.

        **A arte servida nao e a canonica.** E uma renderizacao derivada: a
        canonica (`docs/assets/img/logo.png`, 32,5 % transparente) composta sobre
        **branco** e reamostrada para **180x180** com cantos **retos** — porque o
        sistema compoe transparencia sobre **preto** e aplica a propria mascara
        arredondada. Servir a arte crua daria um quadrado preto.

        Sem `Cache-Control` de validade longa: a arte muda com o pedido do
        operador, e a revalidacao barata vem do `ETag`.
      operationId: iconeDeAtalho
      responses:
        '200':
          description: PNG 180x180, tipo de cor 2 (truecolor **sem** canal alfa).
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Revalidacao por `ETag` — sem corpo.
        '404':
          description: |
            Arte ausente no disco. Corpo **vazio**, e nada mais muda: o atalho
            degrada para icone generico e nenhuma rota existente altera a resposta.
    post:
      tags: [recursos-da-tela]
      summary: Escrita recusada pelo roteador
      operationId: iconeDeAtalhoEscrita
      responses:
        '405':
          description: |
            Recusa do **roteador**, sem uma linha de validacao propria que
            pudesse divergir da convencao.

  /banner.png:
    get:
      tags: [recursos-da-tela]
      summary: Arte do topo da tela
      description: |
        Mesmo desenho de contrato da rota do icone: `GET` sozinho, `ETag` para a
        rebusca, `404` com corpo vazio na ausencia, caminho ancorado no arquivo do
        app e `mimetype="image/png"`.

        **A arte servida nao e a que o operador enviou.** A fonte chegou em `RGB`,
        sem alfa, com o quadriculado de transparencia **gravado no bitmap** — o
        que se serve e uma renderizacao derivada com o fundo removido (remocao
        **global**, em **duas faixas** de brilho, com alfa proporcional na
        fronteira).
      operationId: bannerDoTopo
      responses:
        '200':
          description: PNG RGBA com o fundo removido.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Revalidacao por `ETag` — sem corpo.
        '404':
          description: Arte ausente no disco. Corpo **vazio**; a tela continua de pe, porque o titulo e **texto**.
    post:
      tags: [recursos-da-tela]
      summary: Escrita recusada pelo roteador
      operationId: bannerDoTopoEscrita
      responses:
        '405':
          description: Recusa do **roteador**.

components:
  schemas:
    RequisicaoUploadGedcom:
      type: object
      description: Acao `upload_gedcom` — unit `upload-gedcom`.
      required: [action, gedcom]
      properties:
        action:
          type: string
          enum: [upload_gedcom]
        gedcom:
          type: string
          format: binary
          description: |
            Arquivo GEDCOM. A validacao e de **conteudo**, nao de extensao:
            apos remover um BOM UTF-8 e os espacos a esquerda, precisa comecar
            com `0 HEAD`. Conteudo vazio, com byte NUL ou sem o cabecalho e
            recusado — e as TRES recusas tem o **mesmo texto** na tela
            (`RN-18`); o motivo continua dentro da excecao.

    RequisicaoAposentarArquivo:
      type: object
      description: |
        Acao `aposentar_arquivo` — unit `tela-de-entrada`. **Nada e apagado**:
        o arquivo e movido para `<pasta>/_aposentados/`, e desfazer e mover de volta.
      required: [action, arquivo_a_aposentar]
      properties:
        action:
          type: string
          enum: [aposentar_arquivo]
        arquivo_a_aposentar:
          $ref: '#/components/schemas/ReferenciaDeArquivoDaPasta'

    RequisicaoSelecionarArvore:
      type: object
      description: |
        Acao `selecionar_arvore` — unit `tela-de-entrada`. Resolve a arvore
        clicada e renderiza o **mesmo estado** que o envio produz.
      required: [action, gedcom_filename]
      properties:
        action:
          type: string
          enum: [selecionar_arvore]
        gedcom_filename:
          $ref: '#/components/schemas/ReferenciaDeArquivo'

    RequisicaoBuscaCaminho:
      type: object
      description: |-
        Acao `path_search` — unit `busca-caminho`. Busca **documental**: nao usa DNA.
      required: [action, gedcom_filename, person1_name, person2_name]
      properties:
        action:
          type: string
          enum: [path_search]
        gedcom_filename:
          $ref: '#/components/schemas/ReferenciaDeArquivo'
        person1_name:
          type: string
          description: Nome da primeira pessoa. Recebe `strip`. Resolvido por igualdade sem diferenciar maiusculas e, na falta, por substring.
        person2_name:
          type: string
          description: Nome da segunda pessoa. Mesmo tratamento.

    RequisicaoAnaliseDna:
      type: object
      description: |
        Acao `dna_analysis` — unit `analise-dna`. O CSV pode vir por **arquivo**
        ou por **referencia de um ja armazenado**, e a referencia tem
        **precedencia** quando os dois vem.
      required: [action, gedcom_filename, root_name]
      properties:
        action:
          type: string
          enum: [dna_analysis]
        gedcom_filename:
          $ref: '#/components/schemas/ReferenciaDeArquivo'
        root_name:
          type: string
          description: |
            Nome da pessoa raiz. Resolvido por substring sem diferenciar
            maiusculas; usa o primeiro registro e **avisa** quando ha homonimos.
        matches_csv_filename:
          $ref: '#/components/schemas/ReferenciaDeArquivo'
        matches_csv:
          type: string
          format: binary
          description: |
            CSV de matches de DNA. Leitura tolerante: encoding `utf-8` com recuo
            para `latin-1`, separador decidido pelo cabecalho (nunca `csv.Sniffer`),
            cabecalho localizado sob preambulo e linhas irregulares descartadas
            **com aviso**.

            **Nao passa por validacao de conteudo** — so a forma do nome e
            validada. A assimetria em relacao ao GEDCOM e a divida #10,
            preservada de proposito (`RF-10`).

    ReferenciaDeArquivo:
      type: string
      pattern: '^[0-9a-f]{16}__[^/\\\x00]+$'
      description: |
        Referencia de um arquivo armazenado, devolvida ao navegador em campo
        oculto e reenviada em todo `POST` seguinte.

        E o `sha256` do conteudo truncado em 16 hexadecimais, seguido de `__` e
        do NOME VISIVEL original (com a extensao preservada).

        **A elegibilidade e por FORMA DE NOME, e nao por alfabeto fechado**
        (`RN-20`, `ADR-32`). Ate 2026-10-10 a validacao era o alfabeto
        `^[0-9a-f]{16}__[A-Za-z0-9._-]+$`, que recusava **acento e espaco** — que
        o gravador preserva de proposito. Tres arquivos com acento e um com
        espaco da pasta real ficaram inalcancaveis, e a tela dizia que **nao
        existiam** (`BUG-20261009-6RKP`).

        A defesa contra escape **nao era o alfabeto**: e a exigencia de o valor
        ser um NOME, e nao um caminho — sem barra, sem barra invertida, sem byte
        nulo, sem `.` nem `..`, e igual ao proprio `basename`.

        **Nao e segredo nem tem verificacao de propriedade** — quem a conhece
        carrega a arvore correspondente.
      example: 9f2c1a7b4e6d8b03__Famílias_Sergipanas.csv

    ReferenciaDeArquivoDaPasta:
      type: string
      description: |
        Nome de arquivo simples, aceito pela **aposentadoria**. E deliberadamente
        mais permissivo que `ReferenciaDeArquivo`: os arquivos **sem chave** da
        pasta real sao justamente os inalcancaveis, e sao os que o operador mais
        quer tirar da lista. Exigir a chave aqui os tornaria inapagaveis.

        O adaptador confere, numa **segunda camada**, que o diretorio pai do
        caminho resolvido e exatamente a pasta de upload.
      example: arvore_sem_chave.ged

    Mensagem:
      type: object
      description: |
        Texto ao operador. Sao **literais de contrato**: goldens de tela e o
        harness de paridade dependem deles.
      properties:
        message:
          type: string
          example: Arquivo 'exemplo_familia.ged' carregado!
        success:
          type: boolean
          description: |
            `true` em sucesso **e em "sem conexao"** na busca de caminho.
            `false` em erro de entrada.
        aviso_de_persistencia:
          type: string
          nullable: true
          description: |
            `null` significa "nada a avisar" — gravado, ou persistencia
            desabilitada. Nulo ⇒ a tela **nao renderiza nada**.

            Quando presente: `Historico nao registrado: ...`. A analise conclui e
            e exibida mesmo assim: a persistencia e beneficio, nunca condicao
            para ver o resultado.
          example: 'Histórico não registrado: o driver do banco não está instalado neste interpretador.'

    ItemDaLista:
      type: object
      description: |
        Uma linha das abas da tela de entrada (unit `tela-de-entrada`). A lista e
        entregue em **toda** renderizacao, por processador de contexto.
      properties:
        nome_exibido:
          type: string
          description: Rotulo de tela. **Nunca** contem a chave de conteudo.
        nome_armazenado:
          type: string
          description: Referencia que o formulario devolve.
        chave:
          type: string
          nullable: true
          description: Os 16 hexadecimais, ou `null` quando o arquivo e anterior a chave por conteudo.
        quantidade:
          type: integer
          description: Numero de **arquivos** do grupo (nao de versoes uteis).
        bytes:
          type: integer
          description: '**Soma** dos bytes do grupo.'
        modificado_em:
          type: number
          description: '`st_mtime` do representante, exibido como `dd/mm/aaaa`.'
        disponivel:
          type: boolean
          description: Decidido pela **mesma** funcao que o resolvedor usa.
        motivo_indisponivel:
          type: string
          nullable: true
          description: |
            Um de dois literais: `sem chave de conteúdo no nome` ou
            `nome com caractere que a referência não aceita`.
